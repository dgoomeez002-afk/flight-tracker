<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1c23"/>
  <!-- Radar rings -->
  <circle cx="32" cy="32" r="24" stroke="#ffc107" stroke-width="1" stroke-dasharray="3 4" opacity="0.3"/>
  <circle cx="32" cy="32" r="16" stroke="#ffc107" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
  <circle cx="32" cy="32" r="8"  stroke="#ffc107" stroke-width="1" opacity="0.7"/>
  <!-- Radar sweep line -->
  <line x1="32" y1="32" x2="52" y2="18" stroke="#ffc107" stroke-width="1.5" opacity="0.6"/>
  <!-- Plane icon -->
  <g transform="translate(32,32) rotate(-30)">
    <!-- fuselage -->
    <rect x="-2" y="-10" width="4" height="20" rx="2" fill="#ffc107"/>
    <!-- wings -->
    <polygon points="0,-2 -14,6 -14,10 0,4 14,10 14,6" fill="#ffc107"/>
    <!-- tail -->
    <polygon points="0,8 -6,12 -6,15 0,12 6,15 6,12" fill="#ffc107"/>
  </g>
  <!-- Ping dot -->
  <circle cx="48" cy="20" r="2.5" fill="#ffc107" opacity="0.9"/>
  <circle cx="48" cy="20" r="5" fill="none" stroke="#ffc107" stroke-width="1" opacity="0.4"/>
</svg>
